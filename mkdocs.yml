site_name: PCS Analyzer Documentation
site_url: https://boseokhong.github.io/PCS-analyzer/
site_description: Analysis and visualization of pseudocontact shifts in paramagnetic molecular systems
site_author: Boseok Hong

# Keep repository instructions available to contributors, outside the public manual.
exclude_docs: |
  /AGENTS.md
  /KNOWN_IMPLEMENTATION_ISSUES.md

theme:
  name: material
  language: en

  features:
    # Navigation
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer

    # Table of contents
    - toc.follow

    # Code
    - content.code.copy

    # Search
    - search.suggest
    - search.highlight

  palette:
    - scheme: default
      primary: custom
      accent: custom
      
nav:
  - Home: index.md

  - Getting Started:
      - Installation: installation.md
      - Quick Start: quick-start.md
      - Examples and Practice Data: examples.md
      - Interface Overview: interface.md
      - Projects and Persistence: projects.md
      - Troubleshooting: troubleshooting.md

  - Structures:
      - Loading Structures: structures/loading.md
      - Coordinate System: structures/coordinate-system.md
      - Symmetry and Torsional Ensemble Averaging: structures/symmetry-averaging.md

  - PCS Analysis:
      - PCS Theory: pcs/theory.md
      - Tensor Conventions: pcs/tensor-conventions.md
      - Axial and Rhombic PCS: pcs/axial-rhombic.md
      - PCS Contour Plots: pcs/contour-plots.md

  - Experimental Data:
      - Experimental PCS Data: experimental-data/delta-exp.md
      - Observed and Diamagnetic Shifts: experimental-data/delta-obs-dia.md
      - Import and Export: experimental-data/import-export.md

  - Fitting:
      - Overview: fitting/overview.md
      - Standard Fitting and Rhombicity Tutorial: fitting/standard-fitting-tutorial.md
      - Orientation Fitting: fitting/orientation-fitting.md
      - Full Tensor Fitting: fitting/full-tensor-fitting.md
      - Multi-Conformer Tutorial: fitting/multi-conformer-tutorial.md
      - Joint PCS+RDC Tutorial: fitting/joint-pcs-rdc-tutorial.md
      - PRE Tutorial: fitting/pre-tutorial.md
      - Multi-Lanthanide and Reilley Tutorial: fitting/multi-lanthanide-tutorial.md
      - Quality Metrics: fitting/quality-metrics.md
      - Fit History: fitting/fit-history.md

  - Diagnostics:
      - Residual Analysis: diagnostics/residual-analysis.md
      - Rhombicity Diagnostics: diagnostics/rhombicity.md

  - Visualization:
      - Averaging and Visualization Practice: visualization/averaging-demo.md
      - Chemical Map: visualization/chemical-map.md
      - 2D Polar PCS Plot: visualization/polar-plot.md
      - Projection Viewer: visualization/projection-viewer.md
      - 3D Structure Viewer: visualization/3d-viewer.md
      - 3D PCS Plot: visualization/3d-pcs-isosurface.md

  - PCS Workbench:
      - Overview: pcs-workbench/overview.md
      - Calculation and Convergence: pcs-workbench/calculation.md
      - 3D Data Export: pcs-workbench/exports.md
      - Tensor Transfer: pcs-workbench/tensor-transfer.md

  - NMR Workbench:
      - Overview: nmr/spectrum-viewer.md
      - Raw Data and Processing: nmr/raw-processing.md
      - NMR Data and Observed-Shift Tables: nmr/nmr-data.md
      - Peaks and Assignments: nmr/peak-assignment.md
      - Shift Analysis and PCS Preparation: nmr/non-pcs-analysis.md
      - VT Workflow:
          - Series and Stacked Spectra: nmr/vt-series.md
          - Batch Processing: nmr/batch-processing.md
          - Peak Tracking and Assignment Review: nmr/peak-tracking.md
          - Observed-Shift Analysis: nmr/vt-analysis.md
          - PCS Pairing and Reviewed Transfer: nmr/vt-pcs-preparation.md
      - Sessions and Data Exchange: nmr/sessions.md
      - "Tutorial: FID or CSV to Shift Comparison": nmr/tutorial-fid-csv.md
      - "Tutorial: VT Series": nmr/tutorial-vt.md
      - "Tutorial: Observed Shifts to PCS Fitting": nmr/tutorial-pcs-fitting.md

  - Conformer Search:
      - Overview: conformer-search/overview.md
      - One-Bond Search Tutorial: conformer-search/tutorial.md
      - Constraints: conformer-search/constraints.md
      - Optimization: conformer-search/optimization.md

  - Modules and Plugins:
      - Module Manager: plugins-docs/overview.md
      - Installation and Distribution: plugins-docs/distribution.md
      - Troubleshooting: plugins-docs/troubleshooting.md
      - Plugin Author Reference:
          - Creating Plugins: plugins-docs/creating-plugins.md
          - Manifest: plugins-docs/manifest.md
          - PluginApp: plugins-docs/plugin-api.md
          - Distribution Design Notes: plugin_distribution_guide_v0_1.md

  - Reference:
      - Glossary: reference/glossary.md
      - Current Limitations: reference/limitations.md
      - Mathematical Conventions: reference/mathematical-conventions.md
      - Units: reference/units.md
      - Method References and Reporting: reference/method-references.md
      - File Formats: reference/file-formats.md
      - Changelog: reference/changelog.md

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes

  - pymdownx.details
  - pymdownx.superfences

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  
extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike
    default: latest
